[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laermlogger"
version = "0.1.0"
description = "Lärmmessprotokoll-Logger: DOSTMANN SL322 (RS-232) + USB-Audiointerface, Klassifizierung, TA-Lärm-Kennwerte, Live-Dashboard, PDF-Protokoll"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "ai-edge-litert>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
    "jinja2>=3.1",
    "weasyprint>=60",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
laermlogger = "laermlogger.cli:main"

[tool.setuptools.packages.find]
include = ["laermlogger*"]
